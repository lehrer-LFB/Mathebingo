name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Syntaxprüfung
        run: for f in server/*.mjs js/*.js test/*.mjs e2e/*.mjs; do node --check "$f"; done
      - name: Unit-Tests (Spiellogik, Login, Relay)
        run: npm test
      - name: WebKit für Playwright
        run: npx playwright install --with-deps webkit
      - name: Playwright (iPad-Profile)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
